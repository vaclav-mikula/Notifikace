name: Weekly Newsletter
run-name: ${{ inputs.dry_run && 'Weekly Newsletter (dry-run)' || 'Weekly Newsletter' }}

on:
  # Hlavní spouštěč je externí (cron-job.org → workflow_dispatch, viz README),
  # protože GitHub plánovač běhy zpožďuje i o několik hodin.
  # Tenhle cron je jen záloha; pojistka níže zajistí, že e-mail odejde jednou týdně.
  # Záloha má cílit na 17:25 Praha. GitHub cron je v UTC a letní čas neřeší, proto
  # jsou tu dva (15:25 UTC = 17:25 léto, 16:25 UTC = 17:25 zima) a pojistka pustí jen ten správný.
  schedule:
    - cron: "25 15 * * 5"
    - cron: "25 16 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Jen tisk do logu, e-mail neposílat"
        type: boolean
        default: false
      force:
        description: "Poslat i když už tento týden odešel"
        type: boolean
        default: false

# Externí spouštěč a záložní cron se mohou sejít — druhý běh počká a pak se přeskočí.
concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrola, zda už tento týden odešel
        id: guard
        if: ${{ !inputs.dry_run && !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            # +0200 = letní čas, +0100 = zimní
            if [ "$(TZ=Europe/Prague date +%z)" = "+0200" ]; then expected="25 15 * * 5"; else expected="25 16 * * 5"; fi
            if [ "$CRON" != "$expected" ]; then
              echo "Cron '${CRON}' teď neodpovídá 17:25 v Praze, přeskakuji."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Týden se počítá od pátku 00:00 UTC, aby ruční běh pondělí–čtvrtek páteční newsletter neblokoval.
          # Počítají se jen běhy, kde newsletter opravdu odešel (přeskočené běhy jsou taky „success“).
          friday=$(date -u -d "$(( ($(date -u +%u) + 2) % 7 )) days ago" +%Y-%m-%d)
          sent=0
          for id in $(gh api "repos/${{ github.repository }}/actions/workflows/weekly-newsletter.yml/runs?status=success&created=%3E%3D${friday}" \
              --jq '.workflow_runs[] | select(.display_title | contains("dry-run") | not) | .id'); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Generování a odeslání newsletteru" and .conclusion == "success")] | length')
            sent=$((sent + n))
          done
          echo "Odeslaných newsletterů od ${friday}: ${sent}"
          if [ "$sent" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r weekly-brief/requirements.txt

      - name: Generování a odeslání newsletteru
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python weekly-brief/brief.py
