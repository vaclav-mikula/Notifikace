name: Weekly Newsletter

on:
  schedule:
    # Každou sobotu ve 04:17 UTC = 5:17 CET (zima) / 6:17 CEST (léto).
    - cron: "17 4 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Jen tisk do logu, e-mail neposílat"
        type: boolean
        default: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r weekly-brief/requirements.txt

      - name: Generování a odeslání newsletteru
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python weekly-brief/brief.py
