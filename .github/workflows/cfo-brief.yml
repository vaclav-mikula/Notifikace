name: CFO Newsletter

on:
  schedule:
    # Každé pondělí v 04:30 UTC = 6:30 CEST (léto) / 5:30 CET (zima).
    - cron: "30 4 * * 1"
  workflow_dispatch: {}  # ruční spuštění pro testování

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r cfo-brief/requirements.txt

      - name: Generování a odeslání newsletteru
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python cfo-brief/brief.py
