name: CFO týdenní briefing

on:
  schedule:
    # 6:30 pražského času celoročně — GitHub cron nezná DST, proto dva záznamy:
    # 04:30 UTC = 6:30 CEST (léto, UTC+2)
    # 05:30 UTC = 6:30 CET  (zima, UTC+1)
    # Skript sám zkontroluje pražský čas a pošle e-mail jen jednou.
    - cron: "30 4 * * 1"
    - cron: "30 5 * * 1"
  workflow_dispatch: {}  # ruční spuštění pro testování

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r cfo-brief/requirements.txt

      - name: Generování a odeslání briefingu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python cfo-brief/brief.py
