name: Kontrola objednávek

on:
  schedule:
    # Po-Pá, každých 10 minut, okno 7:30-18:45 pražského LETNÍHO času.
    # GitHub cron je v UTC a NEŘEŠÍ letní/zimní čas — proto je okno psané
    # v UTC (léto = Praha-2h): 05:30-16:40 UTC. V zimě (Praha-1h) se okno
    # přirozeně posune na 6:30-17:40 pražského času (to uživateli vyhovuje).
    # Cca 68 běhů/den → ~1480 účtovaných min/měsíc (limit privátního repa 2000).
    - cron: "30-59/10 5 * * 1-5"   # 07:30, 07:40, 07:50 Praha (léto)
    - cron: "*/10 6-15 * * 1-5"    # 08:00-17:50 Praha (léto)
    - cron: "0-45/10 16 * * 1-5"   # 18:00-18:40 Praha (léto)
  workflow_dispatch: {}  # umožní ruční spuštění tlačítkem

# Potřeba pro commit stavu (seen_count.json) zpět do repozitáře
permissions:
  contents: write

concurrency:
  group: check-orders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Kontrola nových objednávek
        env:
          CUN_EMAIL: ${{ secrets.CUN_EMAIL }}
          CUN_PASSWORD: ${{ secrets.CUN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_orders.py

      - name: Uložení stavu (seen_count.json)
        run: |
          if [[ -n "$(git status --porcelain seen_count.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_count.json
            git commit -m "Aktualizace stavu objednávek [skip ci]"
            git push
          else
            echo "Beze změny stavu."
          fi
