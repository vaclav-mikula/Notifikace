name: Kontrola objednávek

on:
  schedule:
    # Každých 5 minut, posunuté mimo přesné pětiminutovky (:03, :08, :13…),
    # aby běhy nepadaly do špičky GitHubu (kolem :00), kdy je zahazuje.
    # Pozn.: GitHub cron je "best-effort" — reálně bývá o pár minut zpožděný.
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}  # umožní ruční spuštění tlačítkem

# Potřeba pro commit stavu (seen_count.json) zpět do repozitáře
permissions:
  contents: write

concurrency:
  group: check-orders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Kontrola nových objednávek
        env:
          CUN_EMAIL: ${{ secrets.CUN_EMAIL }}
          CUN_PASSWORD: ${{ secrets.CUN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python check_orders.py

      - name: Uložení stavu (seen_count.json)
        run: |
          if [[ -n "$(git status --porcelain seen_count.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_count.json
            git commit -m "Aktualizace stavu objednávek [skip ci]"
            git push
          else
            echo "Beze změny stavu."
          fi
