name: Kontrola objednávek

on:
  # Spouští se jen externě (cron-job.org → workflow_dispatch každých 5 minut nonstop, viz README),
  # protože GitHub plánovač z pětiminutového cronu pustí jen pár běhů denně, a to se zpožděním.
  # Záložní cron na GitHubu záměrně není. Repo je VEŘEJNÉ → minuty zdarma neomezeně.
  workflow_dispatch:  # cron-job.org a ruční spuštění tlačítkem
    inputs:
      test_email:
        description: "Poslat ukázkové e-maily se skutečnými názvy akcí (stav se nemění)"
        type: boolean
        default: false

# contents: commit stavu (seen_orders.json) zpět do repozitáře
# actions: čtení předchozích běhů kvůli toleranci občasných selhání
permissions:
  contents: write
  actions: read

# Kdyby se dva běhy sešly (pomalý běh, ruční spuštění), druhý počká, až první uloží stav.
concurrency:
  group: check-orders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Kontrola nových objednávek
        id: check
        # Web občas krátce nedostupný — selhání vyhodnotí krok „Vyhodnocení selhání“ níže.
        continue-on-error: true
        env:
          CUN_EMAIL: ${{ secrets.CUN_EMAIL }}
          CUN_PASSWORD: ${{ secrets.CUN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python check_orders.py

      - name: Uložení stavu (seen_orders.json)
        if: steps.check.outcome == 'success'
        run: |
          if [[ -n "$(git status --porcelain seen_orders.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_orders.json
            git commit -m "Aktualizace stavu objednávek [skip ci]"
            git push
          else
            echo "Beze změny stavu."
          fi

      # Běh se označí jako neúspěšný (a GitHub pošle e-mail) až při 3. selhání kontroly po sobě.
      # Selhání předchozího běhu se pozná podle toho, že v něm tenhle krok proběhl (nebyl „skipped“),
      # nebo že celý běh skončil chybou (např. selhala instalace). Název kroku proto neměnit.
      - name: Vyhodnocení selhání
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          failed=0
          for run in $(gh api "repos/${REPO}/actions/workflows/check-orders.yml/runs?status=completed&per_page=3" \
              --jq ".workflow_runs[] | select(.id != ${RUN_ID}) | \"\(.id):\(.conclusion)\"" | head -n 2); do
            id=${run%%:*}
            conclusion=${run#*:}
            n=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Vyhodnocení selhání" and .conclusion != "skipped")] | length')
            if [ "$conclusion" = "failure" ] || [ "$n" -gt 0 ]; then
              failed=$((failed + 1))
            else
              break
            fi
          done
          total=$((failed + 1))
          if [ "$total" -ge 3 ]; then
            echo "::error::Kontrola objednávek selhala ${total}× po sobě."
            exit 1
          fi
          echo "::warning::Kontrola objednávek selhala (${total}× po sobě), toleruji — upozornění až od 3. selhání."
